 Bom dia. O que posso fazer pelo(a) senhor(a)?\nB: Minha máquina de lavar está quebrada. Pode me ajudar?\nA: Sim. Quando o(a) senhor(a) tem tempo?\nB: Na sexta de manhã.\nA: Ótimo, então venho às dez horas."}, {"lesson": 18, "de": "A: Was fehlt Ihnen?\nB: Ich habe Rückenschmerzen.\nA: Sie sollen sich mehr bewegen und diese Tabletten nehmen.\nB: Wie oft soll ich sie nehmen?\nA: Zweimal am Tag.", "pt": "A: O que o(a) senhor(a) tem?\nB: Estou com dor nas costas.\nA: O(a) senhor(a) deve se movimentar mais e tomar estes comprimidos.\nB: Quantas vezes devo tomá-los?\nA: Duas vezes por dia."}, {"lesson": 21, "de": "A: Darf man hier grillen?\nB: Nein, das ist leider verboten.\nA: Und darf man hier Fahrrad fahren?\nB: Ja, das ist erlaubt.", "pt": "A: Pode fazer churrasco aqui?\nB: Não, infelizmente é proibido.\nA: E pode andar de bicicleta aqui?\nB: Sim, é permitido."}, {"lesson": 22, "de": "A: Welche Jacke findest du schöner?\nB: Die blaue. Aber die schwarze ist billiger.\nA: Stimmt. Ich finde die blaue trotzdem besser.\nB: Dann nimm die blaue!", "pt": "A: Qual jaqueta você acha mais bonita?\nB: A azul. Mas a preta é mais barata.\nA: Verdade. Mesmo assim, acho a azul melhor.\nB: Então leve a azul!"}, {"lesson": 23, "de": "A: Wie ist das Wetter bei euch?\nB: Heute ist es kalt und bewölkt. Und bei euch?\nA: Hier scheint die Sonne.\nB: Schön! Wohin fahrt ihr am Wochenende?\nA: Wir fahren ans Meer.", "pt": "A: Como está o tempo aí?\nB: Hoje está frio e nublado. E aí?\nA: Aqui está fazendo sol.\nB: Que bom! Para onde vocês vão no fim de semana?\nA: Vamos para o mar."}, {"lesson": 17, "de": "A: Was willst du später werden?\nB: Ich will Ärztin werden. Und du?\nA: Ich weiß es noch nicht. Vielleicht möchte ich im Ausland arbeiten.\nB: Das klingt interessant!", "pt": "A: O que você quer ser no futuro?\nB: Quero ser médica. E você?\nA: Ainda não sei. Talvez eu queira trabalhar no exterior.\nB: Parece interessante!"}],titles=["Berlin gefällt mir.", "Vor dem Kaufhaus nach rechts.", "Ich finde ihr Zimmer schön.", "Wir haben hier ein Problem.", "Ich will ... werden.", "Ich soll diese Übung machen.", "Jetzt sei doch nicht gleich sauer!", "Das Team sieht sehr sympathisch aus!", "Darf man das?", "Mehr, mehr, mehr?", "Es regnet. Na und?", "Der erste Oktober war mein Glückstag!"];let lesson=13,mode='quiz',idx=0,score=JSON.parse(localStorage.getItem('deutschScores')||'{}'),wrong=JSON.parse(localStorage.getItem('deutschWrong')||'{}');const $=x=>document.getElementById(x);function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function data(){return words.filter(x=>x.lesson===lesson)}function changeLesson(n){lesson=n;idx=0;render()}function changeMode(m){mode=m;idx=0;render()}function render(){ $('lessons').innerHTML=titles.map((t,i)=>`<button class="${lesson===i+13?'active':''}" onclick="changeLesson(${i+13})">${i+13} · ${safe(t)}</button>`).join('');$('heading').textContent=`Lektion ${lesson} — ${titles[lesson-13]}`;$('count').textContent=`${data().length} palavras · ${phrases.filter(x=>x.lesson===lesson).length} frases cadastradas`; $('tabs').innerHTML=[['quiz','Quiz'],['cards','Flashcards'],['dialog','Conversação'],['progress','Progresso']].map(([k,v])=>`<button class="${mode===k?'active':''}" onclick="changeMode('${k}')">${v}</button>`).join('');if(mode==='quiz')quiz();if(mode==='cards')cards();if(mode==='dialog')dialog();if(mode==='progress')progress()};function quiz(){let a=data();if(!a.length)return $('content').textContent='Sem palavras nesta lição.';let q=a[idx%a.length],other=a.filter(x=>x.pt!==q.pt).sort(()=>Math.random()-.5).slice(0,3),opts=[q,...other].sort(()=>Math.random()-.5);$('content').innerHTML=`<div class="card"><div class="muted">Qual é a tradução?</div><div class="word">${safe(q.de)}</div><div class="options">${opts.map(o=>`<button onclick="answer(this,${JSON.stringify(o.pt===q.pt)})">${safe(o.pt)}</button>`).join('')}</div><div id="feedback" class="feedback"></div><p><button class="primary" onclick="idx++;quiz()">Próxima palavra →</button></p></div>`;window.current=q}function answer(btn,correct){let f=$('feedback');if(f.dataset.done)return;f.dataset.done='1';score[lesson]??={right:0,total:0};score[lesson].total++;if(correct){score[lesson].right++;f.textContent='✓ Richtig! Muito bem.';f.className='feedback ok'}else{f.textContent='Ainda não. Resposta: '+window.current.pt;f.className='feedback bad';wrong[window.current.de]=(wrong[window.current.de]||0)+1}localStorage.setItem('deutschScores',JSON.stringify(score));localStorage.setItem('deutschWrong',JSON.stringify(wrong))}function cards(){let a=data(),q=a[idx%a.length];$('content').innerHTML=`<div class="card"><div class="muted">Flashcard ${idx%a.length+1} de ${a.length}</div><div class="word">${safe(q.de)}</div><p id="translation" class="muted">Tente lembrar antes de revelar.</p><button onclick="$('translation').textContent=${JSON.stringify(q.pt)}">Mostrar tradução</button> <button class="primary" onclick="idx++;cards()">Próximo →</button></div>`}function dialog(){let a=phrases.filter(x=>x.lesson===lesson),q=a[idx%a.length];if(!q){$('content').textContent='Sem diálogos nesta lição';return}$('content').innerHTML=`<div class="card"><p class="muted">Pratique escrevendo em alemão. Compare sua resposta com a frase de referência do material.</p><div class="word" style="font-size:22px">${safe(q.pt)}</div><input id="reply" placeholder="Escreva em alemão" style="width:90%"><p><button onclick="$('reference').textContent=${JSON.stringify(q.de)}">Ver frase de referência</button> <button class="primary" onclick="idx++;dialog()">Próxima →</button></p><p id="reference" class="feedback"></p></div><p class="muted">Este protótipo mostra uma resposta-modelo, mas ainda não avalia conversas livres ou pronúncia.</p>`}function progress(){let s=score[lesson]||{right:0,total:0},miss=Object.entries(wrong).sort((a,b)=>b[1]-a[1]).slice(0,12);$('content').innerHTML=`<div class="card"><span class="stat">Respos
